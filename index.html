<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Family Tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
:root{--ink:#f1e3c4;--panel:#1f1a14;--line:#c8a45c;--bar:rgba(24,19,13,.95);--bd:#8b6b3d;--ff:Cinzel,Georgia,"Times New Roman",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:13px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#06090b}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,0,.8) 100%)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:linear-gradient(#2d241a,#17120c);border-bottom:2px solid var(--bd);box-shadow:0 3px 10px rgba(0,0,0,.45)}
.bar input,.side input{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:#120e09;color:var(--ink)}
.bar button,.tabs button,.side button{padding:6px 11px;border:1px solid #b8893f;border-radius:7px;background:linear-gradient(#3a2e20,#21190f);color:#f0d9a0;cursor:pointer;font-family:var(--ff);font-weight:600;font-size:12px;letter-spacing:.03em}
.bar button:hover,.tabs button:hover,.side button:hover{filter:brightness(1.25)}.bar .on,.tabs button.on{background:linear-gradient(#b8893f,#7c5619);color:#fff;border-color:#f0d9a0}
.st{font-size:11.5px;color:#f0d9a0;opacity:.85}
.leg{display:flex;gap:6px 10px;flex-wrap:wrap;padding:10px 14px 0;position:relative;z-index:2}
.leg span{display:inline-flex;align-items:center;gap:7px;background:rgba(23,18,12,.88);color:#f0d9a0;padding:3px 10px 3px 8px;border-radius:99px;border:1px solid var(--bd);font-size:11.5px}
.leg b{width:10px;height:10px;transform:rotate(45deg);border:1px solid #fff9;box-shadow:0 0 6px currentColor}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;position:relative;z-index:2}
.wrap{--u:1;overflow-x:auto;padding:10px 24px 70px;position:relative;z-index:2}.wrap.sz0{--u:.8}.wrap.sz2{--u:1.2}
.plate{position:relative;display:inline-block;min-width:270px;padding:11px 44px;margin:0 0 18px;text-align:center;font-family:var(--ff);color:#f0d9a0;text-transform:uppercase;letter-spacing:.09em;background:linear-gradient(#2c3340,#12151b);border-radius:6px;box-shadow:inset 0 0 0 2px #0e1015,inset 0 0 0 3px #b8893f,0 0 0 2px #5b4020,0 5px 12px rgba(0,0,0,.55)}
.plate::before,.plate::after{content:"◆";position:absolute;top:50%;margin-top:-9px;color:#d9a441;font-size:14px;text-shadow:0 0 6px #d9a441}.plate::before{left:14px}.plate::after{right:14px}
.p1{font-weight:700;font-size:15px}.p2{font-size:13px;opacity:.9;margin-top:2px}.pi{display:block;width:100%;margin:2px 0;padding:4px 6px;text-align:center;background:#0b0d11;border:1px solid #b8893f;border-radius:5px;color:#f0d9a0;font-family:var(--ff)}
.n{display:flex;align-items:center}.kids{position:relative;margin-left:26px;display:flex;flex-direction:column}
.kids::before{content:"";position:absolute;left:-26px;top:50%;width:26px;height:3px;margin-top:-1px;background:var(--pc,var(--line));box-shadow:0 0 7px var(--pc,transparent);border-radius:2px}
.kids::after{content:"";position:absolute;left:-5px;top:50%;width:10px;height:10px;margin-top:-5px;transform:rotate(45deg);background:#17120c;border:2px solid var(--pc,var(--line));box-shadow:0 0 7px var(--pc,transparent)}
.k{position:relative;padding:5px 0 5px 26px}
.k::before{content:"";position:absolute;left:0;top:50%;width:26px;height:3px;margin-top:-1px;background:var(--lc);box-shadow:0 0 7px var(--lc);border-radius:2px}
.k::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc);box-shadow:0 0 7px var(--lc);border-radius:2px}
.k:first-child::after{top:50%}.k:last-child::after{bottom:50%}.k:only-child::after{display:none}.kids>.k:only-child::before{left:-26px;width:52px}
.k>.n::before{content:"";position:absolute;left:18px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:var(--er,50%);background:#17120c;border:2px solid var(--lc);box-shadow:0 0 7px var(--lc);z-index:3}
.blue{--b:#2f9bff;--g1:#2578c8;--g2:#123e7c;--glow:#35b6ff;--lc:#35b6ff;--tx:#fff;--er:50%;--orn:"❖";--pat:repeating-radial-gradient(circle at 0 100%,transparent 0 9px,rgba(255,255,255,.12) 9px 10px)}
.pink{--b:#ff3d9a;--g1:#d62a86;--g2:#7d1250;--glow:#ff4fa8;--lc:#ff4fa8;--tx:#fff;--er:50%;--orn:"✿";--pat:radial-gradient(rgba(255,255,255,.18) 1.5px,transparent 2px) 0 0/11px 11px}
.green{--b:#45c452;--g1:#2f9a3a;--g2:#145019;--glow:#4ed05a;--lc:#4ed05a;--tx:#fff;--er:3px;--orn:"❦";--pat:repeating-linear-gradient(60deg,transparent 0 8px,rgba(255,255,255,.11) 8px 9px)}
.orange{--b:#ff8a2a;--g1:#d96a1c;--g2:#7a3008;--glow:#ff8a2a;--lc:#ff8a2a;--tx:#fff;--er:50%;--orn:"✾";--pat:radial-gradient(rgba(255,255,255,.17) 1.5px,transparent 2px) 3px 3px/12px 12px}
.purple{--b:#b05cff;--g1:#7a2fc2;--g2:#3d1068;--glow:#b05cff;--lc:#b05cff;--tx:#fff;--er:3px;--orn:"◈";--pat:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.11) 8px 9px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(255,255,255,.11) 8px 9px)}
.teal{--b:#22d6ff;--g1:#0ea5cc;--g2:#065070;--glow:#22d6ff;--lc:#22d6ff;--tx:#fff;--er:3px;--orn:"≋";--pat:repeating-radial-gradient(circle at 50% 100%,transparent 0 7px,rgba(255,255,255,.14) 7px 8px)}
.yellow{--b:#ffc928;--g1:#e8b01a;--g2:#8a5d04;--glow:#ffc928;--lc:#ffc928;--tx:#2b1d05;--er:3px;--orn:"✠";--pat:repeating-linear-gradient(45deg,transparent 0 9px,rgba(80,50,0,.16) 9px 10px)}
.c{--ring:0 0 0 2px #1a1208,0 0 0 3px var(--b);position:relative;display:flex;align-items:center;margin-left:calc(30px*var(--u));min-width:calc(200px*var(--u));max-width:calc(290px*var(--u));min-height:calc(54px*var(--u));padding:calc(7px*var(--u)) calc(34px*var(--u)) calc(7px*var(--u)) calc(34px*var(--u));border-radius:9px 14px 14px 9px;color:var(--tx);cursor:pointer;font-family:var(--ff);font-size:calc(11.5px*var(--u));font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-shadow:0 1px 2px rgba(0,0,0,.55);
 border:2px solid var(--b);background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%) -200% 0/45% 100% no-repeat,var(--pat),linear-gradient(180deg,var(--g1),var(--g2));
 box-shadow:var(--ring),0 0 11px color-mix(in srgb,var(--glow) 60%,transparent),inset 0 0 0 2px rgba(255,226,160,.35),inset 0 7px 10px rgba(255,255,255,.18),inset 0 -9px 14px rgba(0,0,0,.28);transition:transform .25s,box-shadow .25s,filter .25s}
.yellow.c{text-shadow:none}
.c::after{content:var(--orn);position:absolute;right:calc(9px*var(--u));bottom:calc(2px*var(--u));font-size:calc(24px*var(--u));opacity:.35;pointer-events:none;text-shadow:none}
.av{position:absolute;left:calc(-30px*var(--u));top:50%;margin-top:calc(-26px*var(--u));width:calc(52px*var(--u));height:calc(52px*var(--u));border-radius:50%;display:grid;place-items:center;font-size:calc(21px*var(--u));font-weight:700;color:#f3dca6;text-shadow:0 0 8px #d9a441;background:radial-gradient(circle at 35% 30%,#3a3a42,#0d0d11 70%);border:3px solid var(--b);box-shadow:0 0 0 3px #b8893f,0 0 0 5px #1a1208,0 0 12px var(--glow);transition:transform .45s}
.av::before,.av::after{content:"";position:absolute;width:8px;height:8px;transform:rotate(45deg);background:var(--b);border:1px solid #fffc;box-shadow:0 0 6px var(--glow)}
.av::before{top:-9px;left:50%;margin-left:-4px}.av::after{bottom:-9px;right:6px}
.c .t{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;position:relative;z-index:1}.ln{display:flex;align-items:center;gap:6px;justify-content:space-between}.ln span{overflow-wrap:anywhere}.ln+.ln{font-weight:600;opacity:.95;font-size:.94em}
.bd{flex:none;font-family:system-ui,sans-serif;font-size:.82em;font-weight:700;padding:1px 6px;border-radius:99px;background:#5a0f1a;color:#ffd9de;border:1px solid #ff6b7d;text-shadow:none;letter-spacing:0}.bd.e{background:transparent;border:1px dashed currentColor;opacity:.7}
.c i{position:absolute;right:8px;top:4px;font-style:normal;font-size:11px;z-index:2}
.c.sel{box-shadow:var(--ring),0 0 0 6px rgba(255,255,255,.9),0 0 20px 6px var(--glow)}.c.hit{box-shadow:var(--ring),0 0 0 6px #e53935,0 0 18px 6px #ff7b73}
.c:hover{z-index:4;filter:brightness(1.13);box-shadow:var(--ring),0 0 20px 3px var(--glow),inset 0 0 0 2px rgba(255,226,160,.5),inset 0 7px 10px rgba(255,255,255,.22)}.c:hover .av{transform:rotate(360deg) scale(1.08)}
.blue.c:hover{transform:translateY(-4px);animation:pulse 1.1s infinite}
.pink.c:hover{transform:scale(1.05);animation:shine .9s}
.green.c:hover{animation:sway .7s ease-in-out infinite}
.orange.c:hover{animation:flame .45s infinite alternate}
.purple.c:hover{transform:perspective(320px) rotateY(10deg) scale(1.05)}
.teal.c:hover{transform:translateX(5px);animation:shine 1.2s infinite}
.yellow.c:hover{transform:scale(1.06);animation:gold 1s infinite,shine .8s infinite}
@keyframes shine{from{background-position:-200% 0,0 0,0 0}to{background-position:300% 0,0 0,0 0}}
@keyframes pulse{0%,100%{box-shadow:var(--ring),0 0 9px var(--glow)}50%{box-shadow:var(--ring),0 0 24px 5px var(--glow)}}
@keyframes sway{0%,100%{transform:rotate(-1.8deg) scale(1.03)}50%{transform:rotate(1.8deg) scale(1.03)}}
@keyframes flame{0%{box-shadow:var(--ring),0 0 9px var(--glow);transform:translateY(-1px) scale(1.03)}100%{box-shadow:var(--ring),0 0 24px 4px #ffb24a;transform:translateY(-3px) scale(1.05)}}
@keyframes gold{0%,100%{box-shadow:var(--ring),0 0 11px var(--glow)}50%{box-shadow:var(--ring),0 0 28px 6px #ffe07a}}
@media(prefers-reduced-motion:reduce){.c,.c *{animation:none!important;transition:none!important}}
.tg{width:20px;height:20px;margin-left:8px;border:2px solid var(--lc);border-radius:50%;background:#17120c;color:#fff;font-size:12px;line-height:14px;padding:0;cursor:pointer;flex:none;box-shadow:0 0 6px var(--lc)}
.side{position:fixed;right:0;bottom:0;width:min(350px,100%);max-height:62vh;overflow:auto;background:linear-gradient(#2a2015,#17120c);color:var(--ink);border:2px solid #b8893f;border-radius:14px 14px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.5);display:none;z-index:6}
.side h3{margin:0 0 4px;font:700 16px var(--ff);color:#f0d9a0}.side .m{opacity:.8;margin:3px 0}.side a{color:#8ec9ff;word-break:break-all}
.side select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--bd);background:#120e09;color:var(--ink)}.r{display:flex;gap:6px;align-items:center}.r input{flex:1;min-width:0}.r select{width:auto;flex:none}.dn{color:#ff8a8a!important}
.x{float:right;border:0!important;background:none!important;color:var(--ink)!important;font-size:18px!important;padding:0 4px!important}
/* ---- DARK cinematic theme ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#spot{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle 340px at var(--mx,50%) var(--my,40%),rgba(150,205,225,.10),transparent 70%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:7;background:#cfe9f0;opacity:0}#flash.go{animation:flash .55s}
@keyframes flash{0%{opacity:.55}15%{opacity:.05}30%{opacity:.35}100%{opacity:0}}
.warp{animation:warp .75s}
@keyframes warp{0%{opacity:0;filter:blur(10px) hue-rotate(50deg) brightness(2);transform:scale(1.03)}30%{opacity:.8;filter:blur(2px) hue-rotate(-25deg);transform:translateX(-7px)}50%{opacity:.5;transform:translateX(6px) skewX(2deg)}70%{opacity:1;transform:translateX(-2px)}100%{opacity:1;filter:none;transform:none}}
.c{filter:brightness(.9) saturate(.9)}
.c:hover .t{animation:glitch .45s steps(2) 1}.c:hover .av{animation:jit .3s steps(2) 2}
@keyframes glitch{0%,100%{text-shadow:none;transform:none}20%{text-shadow:2px 0 #ff2d55,-2px 0 #2de2ff;transform:translateX(-1px)}40%{text-shadow:-2px 0 #ff2d55,2px 0 #2de2ff;transform:translateX(1px)}60%{text-shadow:1px 0 #ff2d55,-1px 0 #2de2ff}80%{text-shadow:none;transform:translateY(-1px)}}
@keyframes jit{50%{filter:hue-rotate(60deg) brightness(1.4);transform:translate(1px,-1px)}}
.p1{animation:ptg 7s infinite}
@keyframes ptg{0%,93%,100%{text-shadow:0 0 8px rgba(240,217,160,.35);transform:none}94%{text-shadow:3px 0 #ff2d55,-3px 0 #2de2ff;transform:translateX(-2px)}96%{text-shadow:-3px 0 #ff2d55,3px 0 #2de2ff;transform:translateX(2px) skewX(-6deg)}98%{text-shadow:1px 0 #ff2d55,-1px 0 #2de2ff}}
.plate{animation:flick 9s infinite}@keyframes flick{0%,90%,100%{filter:none}91%{filter:brightness(.55)}92%{filter:brightness(1.3)}93%{filter:brightness(.7)}94%{filter:none}}
/* energy flowing along the threads */
.k::before,.kids::before{background:linear-gradient(90deg,var(--lc,var(--pc)) 30%,#fff 50%,var(--lc,var(--pc)) 70%) 0 0/300% 100%;animation:fx 3.4s linear infinite}
.kids::before{background:linear-gradient(90deg,var(--pc,var(--line)) 30%,#fff 50%,var(--pc,var(--line)) 70%) 0 0/300% 100%}
.k::after{background:linear-gradient(180deg,var(--lc) 30%,#fff 50%,var(--lc) 70%) 0 0/100% 300%;animation:fy 4s linear infinite}
@keyframes fx{from{background-position:100% 0}to{background-position:-100% 0}}@keyframes fy{from{background-position:0 100%}to{background-position:0 -100%}}
@media(prefers-reduced-motion:reduce){.k::before,.k::after,.kids::before,.p1,.plate,.warp,#flash{animation:none!important}}

.ln.dead{color:#9a9ca2!important;text-shadow:none;opacity:.85}.dd{font-style:normal;font-size:.8em;opacity:.9;letter-spacing:0}
.c.dead2{--g1:#171719;--g2:#050506;--pat:none;--b:#3b3b41;--glow:#55555d;--tx:#8d8f95}.c.dead2 .av{color:#8d8f95;text-shadow:none}.c.dead2::after{opacity:.12}
#pop{position:fixed;z-index:8;display:none;pointer-events:none;gap:10px;padding:8px;border-radius:12px;background:rgba(10,12,14,.3);border:1px solid rgba(240,217,160,.4)}
#pop.show{animation:popin .22s}@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
#pop figure{margin:0;width:150px;text-align:center}#pop img{display:block;width:150px;height:190px;object-fit:cover;border-radius:8px;opacity:.5;background:#0a0c0e;box-shadow:0 0 20px rgba(0,0,0,.6)}
#pop figcaption{font:600 10.5px Cinzel,Georgia,serif;color:#f0d9a0;margin-top:5px;text-transform:uppercase;opacity:.8}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.ph figure{margin:0;width:90px;text-align:center;font-size:10px}.ph img{width:90px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);background:#120e09}
.pp{border-top:1px solid var(--bd);padding-top:6px;margin-top:6px}.ck{display:flex;align-items:center;gap:4px;white-space:nowrap}.r .ck input{flex:none;width:auto;min-width:0}img.th{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--bd)}
@media(prefers-reduced-motion:reduce){#pop.show{animation:none}}

#banners{display:flex;gap:10px;padding:18px 8px;margin:-18px -8px 24px;overflow-x:auto}
#banners .plate{flex:1 0 150px;min-width:150px;padding:9px 26px;margin:0;cursor:pointer;transition:filter .45s,opacity .45s,transform .45s,box-shadow .45s;animation:none}
#banners .plate::before{left:9px}#banners .plate::after{right:9px}.p1{font-size:13px}.p2{font-size:11.5px}
#banners .plate:not(.on){filter:grayscale(.85) brightness(.5);opacity:.75;transform:scale(.94)}#banners .plate:not(.on):hover{filter:grayscale(.35) brightness(.85);opacity:1}
#banners .plate:not(.on) .p1{animation:none}
#banners .plate.on{cursor:default;transform:scale(1.03);box-shadow:inset 0 0 0 2px #0e1015,inset 0 0 0 3px #f0d9a0,0 0 0 2px #b8893f,0 0 24px 5px rgba(240,200,110,.55);animation:flick 9s infinite}
#dv,#dh{position:absolute;display:block;pointer-events:none;z-index:2;border-radius:2px;background:#f0d9a0;box-shadow:0 0 8px #f0d9a0,0 0 18px rgba(240,200,110,.6)}
#dv{width:3px}#dh{height:3px}
#dv.go{animation:dvg .45s both}#dh.go{animation:dhg .5s .4s both}
@keyframes dvg{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1);transform-origin:top}}
@keyframes dhg{from{transform:scaleX(0);transform-origin:right}to{transform:scaleX(1);transform-origin:right}}
.kids.top::before,.kids.top::after{display:none}.kids.top>.k:first-child::after{top:0}
.kids.top>.k:only-child::after{display:block;top:0;bottom:50%}.kids.top>.k:only-child::before{left:0;width:26px}
#tree.enter .k{animation:kin .55s both;animation-delay:calc(.85s + var(--i,0)*var(--st,40ms))}
@keyframes kin{from{opacity:0;filter:blur(6px) brightness(2.2)}to{opacity:1;filter:none}}
@media(prefers-reduced-motion:reduce){#tree.enter .k,#dv.go,#dh.go{animation:none!important}}

@media (max-width:720px){
 html,body{overflow-x:hidden}
 .bar{padding:6px 8px;gap:6px}.bar input{min-width:100px;padding:6px 8px;font-size:14px}.bar button{padding:6px 9px;font-size:11px}
 .leg{flex-wrap:nowrap;overflow-x:auto;padding:8px 8px 0;scrollbar-width:none}.leg::-webkit-scrollbar{display:none}.leg span{white-space:nowrap;flex:none}
 #banners{scroll-snap-type:x mandatory;gap:8px;padding:14px 8px;margin:-14px -4px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}#banners::-webkit-scrollbar{display:none}
 #banners .plate{flex:0 0 138px;min-width:138px;scroll-snap-align:center;padding:8px 18px}
 .wrap{--u:.82;padding:8px 8px 100px;overflow-x:hidden}.wrap.sz0{--u:.7}.wrap.sz2{--u:.95}
 .c{font-size:10.5px;letter-spacing:.02em}
 .n{flex-wrap:wrap}.n>.c{min-width:0;max-width:calc(100% - 40px)}
 .n>.kids{flex:0 0 auto;width:calc(100% - 26px*var(--u));margin-left:calc(26px*var(--u));margin-top:2px}.kids.top{margin-top:0;width:auto}
 .kids::before,.kids::after{display:none}
 .k{padding-left:14px;--cy:calc(5px + 27px*var(--u))}
 .k::before{width:14px;top:var(--cy)}.k>.n::before{left:7px;top:var(--cy)}
 .k::after,.k:first-child::after,.kids.top>.k:first-child::after{top:0;bottom:0}
 .k:last-child::after{bottom:auto;height:calc(var(--cy) + 2px)}
 .k:only-child::after,.kids.top>.k:only-child::after{display:block;top:0;bottom:auto;height:calc(var(--cy) + 2px)}
 .kids>.k:only-child::before,.kids.top>.k:only-child::before{left:0;width:14px}
 .tg{width:28px;height:28px;margin-left:6px;font-size:16px;line-height:22px}
 .side{max-height:68vh}
}

/* readable passed-away names */
.ln.dead{color:#d6d9df!important;opacity:1;text-shadow:none}
.ln.dead>span{background:rgba(8,9,12,.55);color:#d9dce2;padding:1px 7px;border-radius:6px;text-shadow:none}
.ln.dead .dd{color:#eceef2;opacity:1}
.c.dead2{--tx:#c9ccd3}.c.dead2 .av{color:#c6c9d0}.c.dead2 .ln.dead>span{background:none;padding:0}
@media (max-width:720px){
 .wrap{--u:1;--ch:50px;--av:38px;--kp:10px;padding:10px 12px 120px}

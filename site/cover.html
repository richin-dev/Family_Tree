<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071013">
  <title>Family Tree</title>
  <style>
    :root{color-scheme:dark;--gold:#e7c47c;--muted:#c9c3b4;--blue:#69d8ee}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:28px;color:#f6f0e3;background:radial-gradient(ellipse at 50% 42%,#14272b 0,#091417 42%,#030708 100%);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    body::before,body::after{content:"";position:fixed;inset:-30%;pointer-events:none}
    body::before{background:linear-gradient(112deg,transparent 36%,rgba(113,203,219,.08) 43%,transparent 50%),linear-gradient(72deg,transparent 48%,rgba(222,187,111,.055) 55%,transparent 62%);animation:lights 16s ease-in-out infinite alternate}
    body::after{inset:0;opacity:.45;background-image:radial-gradient(1px 1px at 12% 22%,#e9d9ad 99%,transparent),radial-gradient(1px 1px at 77% 18%,#b8dce2 99%,transparent),radial-gradient(2px 2px at 86% 72%,#e9d9ad 99%,transparent),radial-gradient(1px 1px at 20% 80%,#b8dce2 99%,transparent);background-size:370px 310px;animation:stars 24s linear infinite}
    main{position:relative;z-index:1;width:min(680px,100%);padding:30px 24px 54px;text-align:center}
    .mark{position:relative;width:clamp(150px,34vw,230px);aspect-ratio:1;margin:0 auto 30px;display:grid;place-items:center;animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both}
    .halo{position:absolute;inset:5%;border:1px solid rgba(231,196,124,.48);border-radius:50%;box-shadow:0 0 38px rgba(105,216,238,.12),inset 0 0 30px rgba(231,196,124,.08);animation:breathe 4s ease-in-out infinite}
    .halo::before,.halo::after{content:"";position:absolute;inset:-7%;border:1px dashed rgba(105,216,238,.38);border-radius:50%;animation:orbit 30s linear infinite}
    .halo::after{inset:14%;border-style:solid;border-color:rgba(231,196,124,.18);animation-direction:reverse;animation-duration:22s}
    .tree-mark{position:relative;width:55%;height:60%;filter:drop-shadow(0 0 18px rgba(105,216,238,.3));animation:sway 5s ease-in-out infinite alternate}
    .tree-mark path{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .tree-mark circle{fill:#70d5df;stroke:#f0d9a0;stroke-width:2}
    .eyebrow{margin:0 0 10px;color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;animation:fade-up .8s .15s both}
    h1{margin:0;color:#f0d9a0;font:700 clamp(34px,8vw,58px)/1.1 Cinzel,Georgia,"Times New Roman",serif;letter-spacing:.045em;text-shadow:0 3px 25px rgba(231,196,124,.18);animation:fade-up .8s .25s both}
    .intro{max-width:460px;margin:18px auto 30px;color:var(--muted);font-size:clamp(15px,3.5vw,18px);animation:fade-up .8s .38s both}
    .explore{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:190px;padding:13px 23px;border:1px solid #f0d9a0;border-radius:999px;color:#17120c;background:linear-gradient(135deg,#f0d9a0,#bd8b3c);box-shadow:0 8px 32px rgba(210,166,78,.2);font:700 14px Cinzel,Georgia,serif;letter-spacing:.12em;text-decoration:none;text-transform:uppercase;transition:transform .2s,box-shadow .2s;animation:fade-up .8s .5s both}
    .explore:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(210,166,78,.34)}
    .explore:focus-visible{outline:3px solid var(--blue);outline-offset:5px}
    .arrow{font:22px/1 system-ui;transition:transform .2s}.explore:hover .arrow{transform:translateX(4px)}
    footer{position:fixed;z-index:2;bottom:14px;left:0;right:0;text-align:center;font-size:12px}
    footer a{color:#c9b787;text-decoration:underline;text-underline-offset:3px;opacity:.75}
    @keyframes lights{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
    @keyframes stars{from{transform:translateY(0)}to{transform:translateY(-32px)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes breathe{50%{transform:scale(1.04);opacity:.7}}
    @keyframes sway{from{transform:rotate(-2deg) translateY(2px)}to{transform:rotate(2deg) translateY(-2px)}}
    @keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
    @keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
    @media(max-height:600px){main{padding-top:8px;padding-bottom:30px}.mark{width:clamp(110px,27vh,170px);margin-bottom:16px}.intro{margin:12px auto 20px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <div class="halo"></div>
      <svg class="tree-mark" viewBox="0 0 100 110" role="presentation">
        <path d="M50 98V57M50 77 31 58M50 70l20-20M50 58 50 38M50 98H34M50 98h16"/>
        <circle cx="50" cy="26" r="12"/><circle cx="28" cy="48" r="10"/><circle cx="73" cy="39" r="10"/>
        <circle cx="38" cy="67" r="8"/><circle cx="64" cy="61" r="8"/>
      </svg>
    </div>
    <p class="eyebrow">A story through generations</p>
    <h1>Family Tree</h1>
    <p class="intro">Discover the people, memories, and connections that make your family story.</p>
    <a class="explore" href="tree.html"><span>Explore</span><span class="arrow" aria-hidden="true">→</span></a>
  </main>
  <footer><a href="privacy.html">Privacy</a></footer>
</body>
</html>

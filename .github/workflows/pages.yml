name: publish-site

# Builds the site from this PRIVATE repo and publishes ONLY the built files to the PUBLIC site repo.
# Contact details (phone, address, blood group) are encrypted during the build; see scripts/build.mjs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SITE_REPO: richin-dev/Family_Tree        # the PUBLIC repo that serves the site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (contact details encrypted)
        env:
          STATIC_PAGES: "1"
          DATA_KEY: ${{ secrets.DATA_KEY }}
          PAGES_BASE: /Family_Tree/
        run: node scripts/build.mjs
      - name: Check nothing readable leaked
        run: |
          rm -f dist/_routes.json dist/_headers
          touch dist/.nojekyll
          if grep -rEl '"(tel|addr|bg)"[[:space:]]*:' dist; then echo "Contact fields found in dist - stopping."; exit 1; fi
      - name: Publish to the public site repo
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${SITE_REPO}.git" out
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. out/
          cd out
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; else git commit -m "Publish ${GITHUB_SHA::7}" && git push; fi

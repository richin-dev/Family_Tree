<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Family Tree — Sign in</title>
<style>
:root{--ink:#f1e3c4;--bd:#8b6b3d;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:16px;font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
 background:radial-gradient(ellipse at 50% 20%,#14222a 0,#070b0e 55%,#030506 100%);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
 linear-gradient(100deg,transparent 30%,rgba(140,190,205,.07) 38%,transparent 46%),linear-gradient(80deg,transparent 52%,rgba(140,190,205,.05) 60%,transparent 68%);animation:sway 12s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
.card{position:relative;width:min(380px,100%);background:linear-gradient(#2a2015,#17120c);border:2px solid #b8893f;border-radius:16px;padding:24px 20px;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.7),0 0 24px rgba(240,200,110,.22)}
h1{margin:0 0 4px;font:700 22px Cinzel,Georgia,"Times New Roman",serif;color:#f0d9a0;letter-spacing:.08em;text-transform:uppercase}
p{margin:0 0 10px;opacity:.75}
label{display:block;text-align:left;font-size:12px;opacity:.8;margin:10px 2px 2px}
.f{position:relative}input{display:block;width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:9px;background:#120e09;color:var(--ink);font:inherit;font-size:16px}
input:focus{outline:2px solid #b8893f;outline-offset:1px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#f0d9a0;cursor:pointer;padding:6px 8px;font-size:12px}
button.go{display:block;width:100%;margin-top:16px;padding:11px;border-radius:9px;border:1px solid #f0d9a0;background:linear-gradient(#b8893f,#7c5619);color:#fff;font:700 15px Cinzel,Georgia,serif;letter-spacing:.04em;cursor:pointer}
button.go:disabled{opacity:.55;cursor:wait}
#msg{min-height:20px;margin-top:12px;font-size:13px;color:#ffb07a}
.back{display:inline-block;margin-top:14px;color:#8ec9ff;font-size:13px}
.note{margin-top:10px;font-size:12px;opacity:.6}
.credit{margin-top:18px;padding-top:10px;border-top:1px solid rgba(184,137,63,.35);font-size:11px;letter-spacing:.12em;opacity:.65}
.forgot{display:inline-block;margin-top:12px;padding:4px 8px;border:0;background:none;color:#8ec9ff;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.reset-note{margin-top:8px;padding:10px;border:1px solid #8b6b3d;border-radius:8px;font-size:12px;opacity:.85}
</style></head><body>
<main class="card">
  <h1>Family Tree</h1><p>Sign in to continue</p>
  <form id="f" autocomplete="on">
    <label for="u">Username</label><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Password</label><div class="f"><input id="p" name="password" type="password" autocomplete="current-password" required><button class="eye" type="button" id="eye" aria-label="Show password">Show</button></div>
    <button class="go" id="go" type="submit">Sign in</button>
    <div id="msg" role="alert" aria-live="polite"></div>
  </form>
  <button class="forgot" type="button" id="forgot" aria-expanded="false" aria-controls="reset-note">Forgot password?</button>
  <div class="reset-note" id="reset-note" hidden>This sign-in does not send password-reset emails. Please contact the family administrator to request a new password.</div>
  <a class="back" href="tree.html">← Back to the family tree</a>
  <div class="note">Accounts are created by the family admin — there is no sign-up. Ask them if you need access.</div>
  <div class="credit">powered by RICHIN THOMAS K</div>
</main>
<script>
const $=id=>document.getElementById(id);
const goNext=()=>{const n=new URLSearchParams(location.search).get('next');location.replace(n&&!n.startsWith('//')&&!n.includes(':')?n:'tree.html')};
$('eye').onclick=()=>{const s=$('p').type==='password';$('p').type=s?'text':'password';$('eye').textContent=s?'Hide':'Show'};
$('forgot').onclick=()=>{const panel=$('reset-note'),open=panel.hidden;panel.hidden=!open;$('forgot').setAttribute('aria-expanded',String(open))};
$('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;$('msg').textContent='';
 const username=$('u').value,password=$('p').value;
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username,password})});
  const ct=r.headers.get('content-type')||'';
  if(r.ok){const data=await r.json().catch(()=>({}));if(data.connectDrive){location.replace('/api/drive/connect');return}goNext();return}
  if(ct.includes('application/json')&&r.status!==404){const d=await r.json().catch(()=>({}));$('msg').textContent=d.error||'Wrong username or password.';$('p').value='';$('p').focus();$('go').disabled=false;return}}
 catch(x){}
 $('msg').textContent='Sign-in is unavailable. Please try again when the server is online.';
 $('p').value='';$('p').focus();$('go').disabled=false};
</script></body></html>
